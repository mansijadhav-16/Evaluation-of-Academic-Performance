{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-md-6">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-warning text-dark text-center">
        <h4 class="mb-0"><i class="fa-solid fa-key me-2"></i>Forgot Password</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {{ form.hidden_tag() }}
          <div class="mb-3">
            <label class="form-label">Email</label>
            {{ form.email(class="form-control") }}
          </div>
          <button type="submit" class="btn btn-warning w-100 py-2">Send OTP</button>
        </form>
        {% if otp_sent %}
          <form method="POST" class="mt-4">
            <input type="hidden" name="email" value="{{ form.email.data }}">
            <div class="mb-3">
              <label class="form-label">Enter OTP</label>
              <input type="text" name="otp" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">New Password</label>
                <div class="input-group">
                  <input type="password" name="new_password" class="form-control" id="forgot-password" required>
                  <span class="input-group-text" onclick="togglePassword('forgot-password', this)"><i class="fa fa-eye"></i></span>
                </div>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2">Reset Password</button>
          </form>
        {% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
