{% extends 'base.html' %}
{% block title %}Manage Divisions{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-lg border-0 mb-4">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0"><i class="fa-solid fa-layer-group me-2"></i>Manage Divisions</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST" class="row g-3 align-items-center">
          <div class="col-auto">
            <input type="text" name="name" class="form-control" placeholder="Division Name" required>
          </div>
          <div class="col-auto">
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Add Division</button>
          </div>
        </form>
      </div>
    </div>
    <div class="card shadow-sm">
      <div class="card-header bg-light fw-bold">All Divisions</div>
      <div class="card-body">
        <ul class="list-group">
          {% for d in divisions %}
            <li class="list-group-item"><i class="fa-solid fa-layer-group me-2 text-primary"></i>{{ d.name }}</li>
          {% endfor %}
        </ul>
      </div>
    </div>
  </div>
</div>
{% endblock %}
