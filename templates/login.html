{% extends 'base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
  <div class="col-md-6">
    <div class="card shadow-lg border-0">
      <div class="card-header bg-primary text-white text-center">
        <h4 class="mb-0"><i class="fa-solid fa-sign-in-alt me-2"></i>Login</h4>
      </div>
      <div class="card-body p-4">
        <form method="POST">
          {{ form.hidden_tag() }}
          <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-envelope me-1"></i> Email</label>
            {{ form.email(class="form-control") }}
          </div>
          <div class="mb-3">
              <label class="form-label"><i class="fa-solid fa-lock me-1"></i> Password</label>
              <div class="input-group">
                {{ form.password(class="form-control", id="login-password") }}
                <span class="input-group-text" onclick="togglePassword('login-password', this)"><i class="fa fa-eye"></i></span>
              </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2"><i class="fa-solid fa-arrow-right-to-bracket me-1"></i>Login</button>
          <div class="mt-3 text-center">
            <a href="{{ url_for('forgot_password') }}">Forgot Password?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
